[project]
name = "notifuse-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing the complete Notifuse API as chat tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Notifuse" }]
keywords = ["notifuse", "mcp", "model-context-protocol", "email", "marketing"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
notifuse-mcp = "notifuse_mcp.__main__:run"
notifuse-mcp-http = "notifuse_mcp.__main__:run_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notifuse_mcp"]
